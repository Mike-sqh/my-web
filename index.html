<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汪雨涵 - 新年快乐·金榜题名</title>
    <style>
        :root {
            --gold: #ffcf7d;
            --deep-red: #8b0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #050505;
            overflow: hidden;
            font-family: 'PingFang SC', 'STHeiti', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        /* 背景画布 */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 音乐组件样式 */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--gold);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 207, 125, 0.3);
        }

        .music-player span { font-size: 24px; }
        
        .rotating {
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 卡片设计 */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        .card {
            width: 100%;
            min-height: 450px;
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 207, 125, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .theme-1 { background: linear-gradient(135deg, #720d0d 0%, #a91b1b 100%); }
        .theme-2 { background: linear-gradient(135deg, #1a1a1a 0%, #434343 100%); }
        .theme-3 { background: linear-gradient(135deg, #0f2027 0%, #203a43 100%); }
        .theme-4 { background: linear-gradient(135deg, #2d1335 0%, #51205a 100%); }

        .title {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .text-area {
            min-height: 120px;
            color: #fff;
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .btn-next {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 30px;
            z-index: 100;
        }

        .btn-next:hover {
            background: var(--gold);
            color: #8b0000;
        }

        .card-hide { opacity: 0; transform: scale(0.8) translateY(30px); }
        .card-show { opacity: 1; transform: scale(1) translateY(0); }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1rem;
            background: var(--gold);
            margin-left: 3px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body onclick="firstTouch()" ontouchstart="firstTouch()">

    <canvas id="fireworks-canvas"></canvas>

    <div class="music-player" id="musicBtn" onclick="toggleMusic(event)" ontouchstart="toggleMusic(event)">
        <span id="musicIcon">🏮</span>
    </div>

    <div class="container">
        <div id="card" class="card theme-1 card-show">
            <h1 class="title">汪雨涵<br>新年快乐</h1>
            <div class="text-area" id="typedOutput"></div>
            <div style="color:var(--gold); font-weight:bold; letter-spacing:5px; margin-top:20px;">金榜题名</div>
        </div>
        <div style="text-align: center;">
            <button class="btn-next" onclick="nextWish(event)" ontouchstart="firstTouch()">抽取下一张祝福卡片</button>
        </div>
    </div>

    <audio id="bgm" loop preload="auto" playsinline webkit-playsinline>
        <source src="https://music.163.com/song/media/outer/url?id=1413142894.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        const output = document.getElementById('typedOutput');
        
        let width, height, fireworks = [];
        let isPlaying = false;
        let hasTouched = false;

        const wishes = [
            "祝你考上理想的大学和理想的专业，新的一年稳扎稳打，实现目标！",
            "愿你所有的努力都不被辜负，在夏天的考场上挥洒自如，金榜题名！",
            "新的一年，愿你眼里的理想大学就在脚下，心中的专业就在指尖。",
            "汪雨涵，祝你在2026年执笔为剑，斩获心仪大学的录取通知书！",
            "万事顺遂，平安喜乐。祝你每一场考试都超常发挥，录取榜上有名！"
        ];
        let wishIdx = 0;

        function init() {
            resize();
            animate();
            typeWriter(wishes[0]);
            window.addEventListener('resize', resize);
        }

        // 安卓端核心修复：确保在任何触摸交互下尝试开启播放
        function firstTouch() {
            if (!hasTouched) {
                audio.play().then(() => {
                    isPlaying = true;
                    musicBtn.classList.add('rotating');
                }).catch(e => {
                    console.log("正在等待用户进一步交互激活音频...");
                });
                hasTouched = true;
            }
        }

        function toggleMusic(e) {
            e.stopPropagation();
            // 防止在手机端点击过快
            if (audio.paused) {
                audio.play();
                musicBtn.classList.add('rotating');
                isPlaying = true;
            } else {
                audio.pause();
                musicBtn.classList.remove('rotating');
                isPlaying = false;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vel = { x: Math.random() * 6 - 3, y: Math.random() * 6 - 3 };
                this.life = 1.0;
            }
            update() {
                this.x += this.vel.x; this.y += this.vel.y;
                this.vel.y += 0.05; this.life -= 0.015;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createFirework() {
            const x = Math.random() * width;
            const y = Math.random() * height * 0.7;
            const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            for (let i = 0; i < 30; i++) fireworks.push(new Particle(x, y, color));
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);
            if (Math.random() < 0.05) createFirework();
            fireworks = fireworks.filter(p => p.life > 0);
            fireworks.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        function typeWriter(text) {
            let i = 0;
            output.innerHTML = "";
            const timer = setInterval(() => {
                if (i < text.length) {
                    output.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 80);
        }

        function nextWish(e) {
            e.stopPropagation();
            firstTouch(); 
            const card = document.getElementById('card');
            card.classList.remove('card-show');
            card.classList.add('card-hide');
            setTimeout(() => {
                wishIdx = (wishIdx + 1) % wishes.length;
                const themeIdx = (wishIdx % 4) + 1;
                card.className = `card theme-${themeIdx} card-show`;
                typeWriter(wishes[wishIdx]);
            }, 600);
        }

        // 针对微信环境下安卓手机自动播放的补丁
        document.addEventListener("WeixinJSBridgeReady", function () {
            audio.play();
            isPlaying = true;
            musicBtn.classList.add('rotating');
        }, false);

        init();
    </script>
</body>
</html>
